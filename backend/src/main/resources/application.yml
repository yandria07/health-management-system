server:
  servlet:
    context-path: /api
  port: ${PORT:8080}
spring:
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    url: ${JDBC_URL:jdbc:mysql://127.0.0.1:3306/student?characterEncoding=UTF-8&&serverTimezone=GMT}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:Cyybs@0402}
    driver-class-name: com.mysql.cj.jdbc.Driver
    druid:
      initial-size: 5
      min-idle: 10
      max-active: 20
      max-wait: 60000
      validation-query: SELECT 1
      test-on-borrow: true
      test-while-idle: true
      test-on-return : false
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    group: 'default'
    paths-to-match: '/**'
    packages-to-scan: com.health.healthserver.controller

knife4j:
  enable: true
  setting:
    language: zh_cn