services:
  # 后端 - Spring Boot Web Service
  - type: web
    name: health-backend
    env: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    envVars:
      - key: JDBC_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false

  # 前端 - Vue 静态站点
  - type: web
    name: health-frontend
    env: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://health-backend.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
